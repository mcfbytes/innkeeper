[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
tsn-link = { path = "crates/tsn-link" }
pad_thai = { path = "crates/pad_thai" }
int14h = { path = "crates/int14h" }
innkeeper-session = { path = "crates/innkeeper-session" }
innkeeper-world = { path = "crates/innkeeper-world" }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "signal", "sync"] }
clap = { version = "4", features = ["derive"] }
humantime = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
sha2 = "0.10"
hmac = "0.12"
serde_json = "1"
base64 = "0.22"
aes-gcm = "0.10"
rsa = { version = "0.9", features = ["pem", "sha2", "getrandom"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
landlock = "0.4"
seccompiler = "0.5"
prctl = "1"
libc = "0.2"
# Sign-in (docs/server/innkeeperd.md section 8). Each is MIT, Apache-2.0, BSD or ISC.
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "hickory-dns"] }
openidconnect = { version = "4", default-features = false, features = ["reqwest"] }
oauth2 = { version = "5", default-features = false, features = ["reqwest"] }
url = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
zeroize = "1"
sha1 = "0.10"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
